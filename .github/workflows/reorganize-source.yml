name: Reorganizar codigo-fonte

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar codigo-fonte principal
        shell: bash
        run: |
          set -euo pipefail
          cat staging/runtime.* | tr -d '\r\n ' | base64 -d > /tmp/finance-runtime.zip
          unzip -t /tmp/finance-runtime.zip
          unzip -oq /tmp/finance-runtime.zip -d .

          test -f index.html
          test -f css/app.css
          test -f js/app.js

          cat > render.yaml <<'EOF'
          services:
            - type: web
              runtime: static
              name: finance-premium-web
              buildCommand: echo "Finance Premium - static site"
              staticPublishPath: .
              autoDeployTrigger: commit
          EOF

          cat > .gitignore <<'EOF'
          .DS_Store
          Thumbs.db
          *.log
          .vscode/
          .idea/
          EOF

          rm -rf deploy-runtime deploy-parts staging
          rm -f finance-premium-site.zip
          rm -f .github/workflows/reorganize-source.yml

      - name: Publicar estrutura limpa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganiza projeto para deploy direto no Render"
          git push origin HEAD:main
